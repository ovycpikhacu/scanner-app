<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Price Scanner</title>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
:root{--bg:#f6f5f2;--ink:#1b1b1b;--mute:#6b6b66;--card:#fff;--line:#dcdad3;--red:#d6291f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--ink:#f2f1ec;--mute:#9a9992;--card:#1e1e1c;--line:#34342f;--red:#ff5a4d}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
.cam{position:relative;flex:1 1 40%;min-height:180px;background:#000;overflow:hidden}
video{width:100%;height:100%;object-fit:cover;display:block}
.frame{position:absolute;inset:0;margin:auto;width:78%;max-width:420px;height:40%;border:2px solid rgba(255,255,255,.85);border-radius:10px;pointer-events:none}
.frame::after{content:"";position:absolute;left:6px;right:6px;top:50%;height:2px;background:var(--red);box-shadow:0 0 8px var(--red)}
.msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;color:#fff;font-size:15px;line-height:1.5}
.top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px}
.bar{position:absolute;bottom:10px;left:10px;right:10px;display:flex;justify-content:center;gap:8px}
.top button,.bar button{background:rgba(0,0,0,.6);color:#fff;font-size:15px;padding:9px 14px;border-radius:999px}
.msg{pointer-events:none}
.cam.off video{visibility:hidden}
.cam.off .frame{display:none}
.panel{flex:0 0 auto;padding:18px 20px 22px;background:var(--card);border-top:1px solid var(--line)}
.hint{color:var(--mute);font-size:15px;margin:0}
.name{font-size:22px;font-weight:600;line-height:1.25;margin:0 0 4px;overflow-wrap:anywhere}
.price{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin:0}
.row{display:flex;gap:8px;margin-top:12px}
input{flex:1;min-width:0;width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
button{font:inherit;font-size:16px;font-weight:600;padding:11px 16px;border:0;border-radius:8px;background:var(--ink);color:var(--bg);cursor:pointer}
button.ghost{background:transparent;color:var(--mute);font-weight:500;padding:8px 0;margin-top:6px}
.fit{flex:none;width:auto}
.small{color:var(--mute);font-size:13px;margin:12px 0 0}
.lookup{margin-top:14px}
.searchWrap{position:relative}
input[type=search]{-webkit-appearance:none;appearance:none}
.results{position:absolute;left:0;right:0;bottom:100%;margin-bottom:6px;max-height:min(45vh,320px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.28);display:none;z-index:4}
.results button{display:flex;justify-content:space-between;gap:12px;width:100%;background:transparent;color:var(--ink);font-weight:500;border-radius:0;border-bottom:1px solid var(--line);text-align:left;padding:12px 14px}
.results button:last-child{border-bottom:0}
.results .pr{font-variant-numeric:tabular-nums;color:var(--mute);white-space:nowrap}
.results .none{padding:12px 14px;color:var(--mute);font-size:15px}
.sheet{position:fixed;inset:0;background:var(--bg);padding:calc(20px + env(safe-area-inset-top,0px)) 20px 24px;overflow:auto;display:none;z-index:5}
.sheet label{display:block;font-size:14px;color:var(--mute);margin:16px 0 6px}
.sheet h2{margin:0;font-size:22px}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.frame::after{animation:s 2.2s ease-in-out infinite alternate}}
@keyframes s{from{top:12%}to{top:88%}}
</style>
</head>
<body>
<div class="cam" id="cam">
  <video id="v" playsinline muted></video>
  <div class="frame"></div>
  <div class="msg" id="err"></div>
  <div class="top"><button id="sync">Sync</button><button id="gear" aria-label="Settings">Settings</button></div>
  <div class="bar"><button id="camBtn">Turn camera off</button><button id="focusBtn">Refocus</button><button id="torchBtn" style="display:none">Light on</button></div>
</div>
<div class="panel">
  <div id="out"><p class="hint">Point the camera at a barcode.</p></div>
  <div class="searchWrap lookup">
    <div class="results" id="results"></div>
    <input id="search" type="search" placeholder="Search by product name" aria-label="Search by product name" autocomplete="off">
  </div>
  <div class="row">
    <input id="code" inputmode="numeric" placeholder="Or type a barcode number" aria-label="Barcode number">
    <button id="go" class="fit">Look up</button>
  </div>
  <p class="small" id="note"></p>
</div>

<div class="sheet" id="sheet">
  <h2>Settings</h2>
  <label for="s_user">GitHub username</label><input id="s_user" autocapitalize="none" autocomplete="off">
  <label for="s_repo">Private repo name (holds your products)</label><input id="s_repo" autocapitalize="none" autocomplete="off">
  <label for="s_tok">Access token</label><input id="s_tok" type="password" autocomplete="off">
  <label for="s_cur">Currency code (IDR = Rupiah)</label><input id="s_cur" autocapitalize="characters" maxlength="3">
  <p class="small">The token is kept in this browser only. Anyone who can use this phone could use it, so keep the phone locked.</p>
  <div class="row"><button id="s_save" class="fit">Save settings</button><button id="s_close" class="ghost fit">Close</button></div>
</div>

<script>
var out = document.getElementById("out"), note = document.getElementById("note"), syncBtn = document.getElementById("sync");
var last = "", lastAt = 0, editing = false, busy = false;

function load(k, d){ try{ var j = localStorage.getItem(k); return j ? JSON.parse(j) : d; }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ setNote("Couldn’t save on this phone. Storage may be full or blocked."); } }
var cfg = load("cfg", {user:"", repo:"", token:"", currency:"IDR"});
var products = load("products", {});
var dirty = load("dirty", []);

function money(n){
  var c = cfg.currency || "IDR";
  try{ return new Intl.NumberFormat(c === "IDR" ? "id-ID" : undefined, c === "IDR" ? {style:"currency",currency:"IDR",minimumFractionDigits:0,maximumFractionDigits:0} : {style:"currency",currency:c}).format(n); }
  catch(e){ return String(n); }
}
function setNote(t){ note.textContent = t; }
function refreshStatus(){
  syncBtn.textContent = dirty.length ? "Sync (" + dirty.length + ")" : "Sync";
  setNote(dirty.length ? dirty.length + " change" + (dirty.length > 1 ? "s" : "") + " not synced to GitHub yet." : (cfg.token ? "All changes synced." : "Open Settings to connect GitHub."));
}
function parsePrice(s){
  s = s.trim().replace(/\s/g, "");
  if (/^\d{1,3}([.,]\d{3})+$/.test(s)) return parseFloat(s.replace(/[.,]/g, ""));
  return parseFloat(s.replace(",", "."));
}

function showFound(code, p){
  closeResults();
  editing = false;
  out.innerHTML = '<p class="name"></p><p class="price"></p><button class="ghost" id="ed">Edit</button>';
  out.querySelector(".name").textContent = p.name;
  out.querySelector(".price").textContent = money(p.price);
  document.getElementById("ed").onclick = function(){ showForm(code, p); };
}
function showForm(code, p){
  closeResults();
  editing = true;
  out.innerHTML = '<p class="hint" id="bc"></p>'
    + '<div class="row"><input id="n" placeholder="Product name" aria-label="Product name"></div>'
    + '<div class="row"><input id="pr" inputmode="decimal" placeholder="Price" aria-label="Price"><button id="sv" class="fit">Save</button></div>'
    + '<p class="small" id="fe"></p>';
  document.getElementById("bc").textContent = (p ? "Edit product " : "New product ") + code;
  var n = document.getElementById("n"), pr = document.getElementById("pr");
  if (p){ n.value = p.name; pr.value = p.price; }
  (p ? pr : n).focus();
  document.getElementById("sv").onclick = function(){
    var name = n.value.trim(), price = parsePrice(pr.value), fe = document.getElementById("fe");
    if (!name){ fe.textContent = "Enter a product name."; return; }
    if (isNaN(price) || price < 0){ fe.textContent = "Enter a valid price."; return; }
    products[code] = {name:name, price:price};
    if (dirty.indexOf(code) < 0) dirty.push(code);
    save("products", products); save("dirty", dirty);
    last = code; lastAt = Date.now();
    showFound(code, products[code]); refreshStatus();
  };
}
function onCode(code){
  if (editing) return;
  var now = Date.now();
  if (code === last && now - lastAt < 2500) return;
  last = code; lastAt = now;
  if (navigator.vibrate){ try{ navigator.vibrate(60); }catch(e){} }
  products[code] ? showFound(code, products[code]) : showForm(code, null);
}
document.getElementById("go").onclick = function(){
  var c = document.getElementById("code").value.replace(/\s/g, "");
  if (!c) return;
  editing = false; last = ""; onCode(c);
};
document.getElementById("code").addEventListener("keydown", function(e){ if (e.key === "Enter") document.getElementById("go").click(); });

// ---- search by name (any word order, partial words, small typos) ----
function norm(t){ return String(t).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, " ").trim(); }
function lev(a, b){
  var prev = [], cur = [], i, j;
  for (j = 0; j <= b.length; j++) prev[j] = j;
  for (i = 1; i <= a.length; i++){
    cur = [i];
    for (j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    prev = cur;
  }
  return prev[b.length];
}
function searchProducts(query){
  var q = norm(query);
  if (!q) return [];
  var words = q.split(" "), res = [];
  Object.keys(products).forEach(function(code){
    var n = norm(products[code].name), toks = n.split(" "), total = 0, ok = true;
    for (var k = 0; k < words.length && ok; k++){
      var w = words[k], best = -1, i, t;
      if (/^\d+$/.test(w) && code.indexOf(w) >= 0) best = 0;
      for (i = 0; i < toks.length && best !== 0; i++) if (toks[i].indexOf(w) === 0) best = 0;
      if (best < 0 && w.length > 1 && (n.indexOf(w) >= 0 || n.replace(/ /g, "").indexOf(w) >= 0)) best = 1;
      if (best < 0){
        var maxd = w.length >= 6 ? 2 : (w.length >= 3 ? 1 : 0);
        if (maxd) for (i = 0; i < toks.length; i++){
          t = toks[i];
          var d = Math.min(lev(w, t), lev(w, t.slice(0, w.length)));
          if (d <= maxd && (best < 0 || 2 + d < best)) best = 2 + d;
        }
      }
      if (best < 0) ok = false; else total += best;
    }
    if (ok) res.push({code:code, p:products[code], sc:total});
  });
  res.sort(function(a, b){ return a.sc - b.sc || a.p.name.localeCompare(b.p.name); });
  return res.slice(0, 30);
}
var sEl = document.getElementById("search"), resEl = document.getElementById("results");
function closeResults(){ resEl.style.display = "none"; resEl.innerHTML = ""; sEl.value = ""; }
function runSearch(){
  if (!norm(sEl.value)){ resEl.style.display = "none"; resEl.innerHTML = ""; return; }
  var list = searchProducts(sEl.value);
  resEl.innerHTML = "";
  if (!list.length){
    var d = document.createElement("div"); d.className = "none";
    d.textContent = Object.keys(products).length ? "No matching product." : "No products saved yet.";
    resEl.appendChild(d);
  }
  list.forEach(function(r){
    var b = document.createElement("button"), a = document.createElement("span"), c = document.createElement("span");
    a.textContent = r.p.name; c.className = "pr"; c.textContent = money(r.p.price);
    b.appendChild(a); b.appendChild(c);
    b.onclick = function(){ showFound(r.code, r.p); };
    resEl.appendChild(b);
  });
  resEl.style.display = "block";
}
sEl.addEventListener("input", runSearch);
sEl.addEventListener("focus", runSearch);
sEl.addEventListener("keydown", function(e){ if (e.key === "Enter"){ var f = resEl.querySelector("button"); if (f) f.click(); } });
document.addEventListener("click", function(e){ if (!e.target.closest(".searchWrap")){ resEl.style.display = "none"; } });

// ---- GitHub sync: pulls the latest file, merges your changes, saves one commit ----
function enc(s){ var b = new TextEncoder().encode(s), r = ""; b.forEach(function(x){ r += String.fromCharCode(x); }); return btoa(r); }
function dec(b){ var r = atob(b.replace(/\s/g, "")), a = new Uint8Array(r.length); for (var i = 0; i < r.length; i++) a[i] = r.charCodeAt(i); return new TextDecoder().decode(a); }
async function sync(){
  if (busy) return;
  if (!cfg.user || !cfg.repo || !cfg.token){ openSettings(); return; }
  busy = true; setNote("Syncing…");
  var url = "https://api.github.com/repos/" + encodeURIComponent(cfg.user) + "/" + encodeURIComponent(cfg.repo) + "/contents/products.json";
  var H = {"Authorization":"Bearer " + cfg.token, "Accept":"application/vnd.github+json"};
  try{
    for (var attempt = 0; attempt < 3; attempt++){
      var r = await fetch(url, {headers:H, cache:"no-store"}), remote = {}, sha = null;
      if (r.status === 200){ var j = await r.json(); sha = j.sha; remote = JSON.parse(dec(j.content)) || {}; }
      else if (r.status === 401 || r.status === 403) throw new Error("GitHub didn’t accept the token. Check it in Settings.");
      else if (r.status !== 404) throw new Error("GitHub error " + r.status + ".");
      var merged = Object.assign({}, remote);
      dirty.forEach(function(c){ merged[c] = products[c]; });
      if (dirty.length){
        var body = {message:"Update products", content:enc(JSON.stringify(merged, null, 1))};
        if (sha) body.sha = sha;
        var w = await fetch(url, {method:"PUT", headers:Object.assign({"Content-Type":"application/json"}, H), body:JSON.stringify(body)});
        if (w.status === 409 || w.status === 422) continue;
        if (w.status === 404) throw new Error("Repo not found. Check the username, repo name and token access.");
        if (!w.ok) throw new Error("Couldn’t save to GitHub (error " + w.status + ").");
      } else if (r.status === 404){
        var rr = await fetch("https://api.github.com/repos/" + encodeURIComponent(cfg.user) + "/" + encodeURIComponent(cfg.repo), {headers:H, cache:"no-store"});
        if (!rr.ok) throw new Error("Repo not found. Check the username, repo name and token access.");
      }
      products = merged; dirty = []; save("products", products); save("dirty", dirty);
      busy = false; refreshStatus(); return;
    }
    throw new Error("Someone else saved at the same time. Tap Sync again.");
  }catch(e){
    busy = false;
    setNote((e && e.message && e.message.indexOf("fetch") < 0 ? e.message : "No connection. Your changes are safe on this phone. Try Sync again later."));
  }
}
syncBtn.onclick = sync;

// ---- settings ----
var sheet = document.getElementById("sheet");
function openSettings(){
  document.getElementById("s_user").value = cfg.user;
  document.getElementById("s_repo").value = cfg.repo;
  document.getElementById("s_tok").value = cfg.token;
  document.getElementById("s_cur").value = cfg.currency;
  sheet.style.display = "block";
}
document.getElementById("gear").onclick = openSettings;
document.getElementById("s_close").onclick = function(){ sheet.style.display = "none"; };
document.getElementById("s_save").onclick = function(){
  cfg = {
    user: document.getElementById("s_user").value.trim(),
    repo: document.getElementById("s_repo").value.trim(),
    token: document.getElementById("s_tok").value.trim(),
    currency: (document.getElementById("s_cur").value.trim() || "IDR").toUpperCase()
  };
  save("cfg", cfg); sheet.style.display = "none"; refreshStatus();
  if (cfg.user && cfg.repo && cfg.token) sync();
};
window.addEventListener("beforeunload", function(e){ if (dirty.length){ e.preventDefault(); e.returnValue = ""; } });

// ---- camera (can be turned off to save battery) ----
var camEl = document.getElementById("cam"), vid = document.getElementById("v"), msgEl = document.getElementById("err");
var camBtn = document.getElementById("camBtn"), torchBtn = document.getElementById("torchBtn"), torchOn = false, camOn = false, stream = null, scanId = 0, reader = null, resumeCam = false;
function showMsg(t){ msgEl.textContent = t; msgEl.style.display = "flex"; }
function flash(t){ setNote(t); setTimeout(refreshStatus, 1800); }
function stopCam(){
  camOn = false; scanId++;
  if (reader){ try{ reader.reset(); }catch(e){} reader = null; }
  if (stream){ stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; }
  vid.srcObject = null;
  camEl.classList.add("off");
  showMsg("Camera is off to save battery. Tap “Turn camera on” to scan.");
  camBtn.textContent = "Turn camera on";
  torchBtn.style.display = "none"; torchOn = false; torchBtn.textContent = "Light on";
}
function validCode(c){
  if (!/^\d+$/.test(c) || (c.length !== 13 && c.length !== 12 && c.length !== 8)) return true;
  var d = c.split("").map(Number), chk = d.pop(), sum = 0, w = 3;
  for (var i = d.length - 1; i >= 0; i--, w = (w === 3 ? 1 : 3)) sum += d[i] * w;
  return (10 - sum % 10) % 10 === chk;
}
var cand = "", candN = 0, candAt = 0;
function accept(raw, skipCheck){
  if (!raw) return;
  if (!skipCheck && !validCode(raw)) return;      // wrong check digit = misread, ignore
  var now = Date.now();
  if (raw === cand && now - candAt < 1500) candN++; else { cand = raw; candN = 1; }
  candAt = now;
  if (candN >= 3){ candN = 0; onCode(raw); }      // only accept after 3 identical reads in a row
}
async function startCam(){
  if (camOn) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ showMsg("Camera isn’t available here. Type the barcode number below instead."); return; }
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}, width:{ideal:1920}, height:{ideal:1080}}, audio:false});
    vid.srcObject = stream; await vid.play();
  }catch(e){ stream = null; showMsg("Camera access was blocked. Allow the camera for this site, or type the barcode number below."); return; }
  camOn = true; msgEl.style.display = "none"; camEl.classList.remove("off"); camBtn.textContent = "Turn camera off";
  try{
    var t = stream.getVideoTracks()[0], caps = t.getCapabilities ? t.getCapabilities() : {};
    if (caps.focusMode && caps.focusMode.indexOf("continuous") >= 0) t.applyConstraints({advanced:[{focusMode:"continuous"}]}).catch(function(){});
    torchBtn.style.display = caps.torch ? "" : "none";
  }catch(e){}
  var id = ++scanId;
  if ("BarcodeDetector" in window){
    try{
      var det = new BarcodeDetector({formats:["ean_13","ean_8","upc_a","code_128"]});
      (function loop(){
        if (id !== scanId) return;
        det.detect(vid).then(function(r){ if (id === scanId && r.length) accept(r[0].rawValue, r[0].format === "code_128"); }).catch(function(){}).then(function(){ setTimeout(loop, 200); });
      })();
      return;
    }catch(e){}
  }
  if (window.ZXing){
    var hints = new Map(), F = ZXing.BarcodeFormat;
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [F.EAN_13, F.EAN_8, F.UPC_A, F.CODE_128]);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    reader = new ZXing.BrowserMultiFormatReader(hints, 150);
    reader.decodeFromVideoElement(vid, function(res){ if (id === scanId && res) accept(res.getText(), res.getBarcodeFormat() === F.CODE_128); });
  } else { showMsg("Scanner failed to load. Type the barcode number below instead."); }
}
async function refocus(){
  if (!camOn || !stream) return;
  var t = stream.getVideoTracks()[0], modes = [];
  try{ modes = (t.getCapabilities && t.getCapabilities().focusMode) || []; }catch(e){}
  if (modes.indexOf("single-shot") >= 0){
    try{
      await t.applyConstraints({advanced:[{focusMode:"single-shot"}]});
      if (modes.indexOf("continuous") >= 0) setTimeout(function(){ t.applyConstraints({advanced:[{focusMode:"continuous"}]}).catch(function(){}); }, 1500);
      flash("Refocusing…"); return;
    }catch(e){}
  }
  flash("Refocusing…");
  stopCam(); await startCam();   // this phone doesn’t allow focus control, so restart the camera instead
}
torchBtn.onclick = function(){
  if (!stream) return;
  torchOn = !torchOn;
  stream.getVideoTracks()[0].applyConstraints({advanced:[{torch:torchOn}]}).then(function(){ torchBtn.textContent = torchOn ? "Light off" : "Light on"; }).catch(function(){ torchOn = false; flash("Light isn’t available on this phone."); });
};
camBtn.onclick = function(){ camOn ? stopCam() : startCam(); };
document.getElementById("focusBtn").onclick = refocus;
camEl.addEventListener("click", function(e){ if (!e.target.closest("button")) refocus(); });
document.addEventListener("visibilitychange", function(){
  if (document.hidden && camOn){ resumeCam = true; stopCam(); }
  else if (!document.hidden && resumeCam){ resumeCam = false; startCam(); }
});
refreshStatus();
if (cfg.user && cfg.repo && cfg.token && !dirty.length) sync();
startCam();
</script>
</body>
</html>
